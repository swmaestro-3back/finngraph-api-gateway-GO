name: finngraph-gateway

services:
  gateway:
    image: ${GW_IMAGE:?GW_IMAGE 를 .env 에 지정하세요}
    platform: linux/arm64
    container_name: finngraph-gateway
    ports:
      - "${GW_BIND:-0.0.0.0:8090}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Seoul
      GW_CLIENT_IP_SOURCE: ${GW_CLIENT_IP_SOURCE:-xff}
      GW_BACKEND_URL: ${GW_BACKEND_URL:?backend 사설 주소 필요 (.env 또는 셸/compose에 지정)}
      GW_KG_URL: ${GW_KG_URL:?kg 사설 주소 필요 (.env 또는 셸/compose에 지정)}
      GW_JWT_PUBLIC_KEY: ${GW_JWT_PUBLIC_KEY:-}
      GW_CORS_ORIGINS: ${GW_CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /finngraph/dev/api-gateway
        tag: "{{.Name}}/{{.ID}}"
        mode: non-blocking
        max-buffer-size: 4m
    restart: unless-stopped
    stop_grace_period: 15s
