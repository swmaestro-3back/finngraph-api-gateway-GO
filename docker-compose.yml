name: finngraph-gateway

services:
  gateway:
    build: .
    container_name: finngraph-gateway
    ports:
      - "127.0.0.1:8090:8080"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Seoul
      GW_JWT_PUBLIC_KEY: ${GW_JWT_PUBLIC_KEY:-}
      GW_CORS_ORIGINS: ${GW_CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - etl
      - backend
      - gwnet

  gw-redis:
    image: redis:7-alpine
    container_name: finngraph-gateway-redis
    networks:
      - gwnet
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  etl:
    external: true
    name: finngraph-etl_default
  backend:
    external: true
    name: finngraph-backend_default
  gwnet: {}
