name: ci-cd

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/gateway

  deliver:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: swmaestro-3back/github-actions/.github/workflows/docker.delivery.yaml@main
    with:
      image_name: finngraph/api-gateway
    secrets:
      oidc_role_arn: ${{ secrets.OIDC_ROLE_ARN }}

  deploy:
    needs: deliver
    permissions:
      contents: read
      id-token: write
    uses: swmaestro-3back/github-actions/.github/workflows/ssm.deploy.yaml@main
    with:
      instance_id: ${{ secrets.DEPLOY_INSTANCE_ID }}
      compose_dir: /home/ubuntu/finngraph-gateway
      compose_file: docker-compose.prod.yml
      service: gateway
      image_env_var: GW_IMAGE
      image: ${{ needs.deliver.outputs.image_ref }}
      health_url: http://127.0.0.1:8090/healthz
    secrets:
      oidc_role_arn: ${{ secrets.OIDC_ROLE_ARN }}
