name: finngraph-gateway

services:
  gateway:
    build: .
    image: ${GW_IMAGE:-finngraph-gateway:latest}
    container_name: finngraph-gateway
    ports:
      - "${GW_BIND:-0.0.0.0:8090}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Seoul
      GW_CLIENT_IP_SOURCE: (백엔드 개발자에게 연락)
      GW_BACKEND_URL: ${GW_BACKEND_URL:?backend 사설 주소 필요 (.env 또는 셸/compose에 지정)}
      GW_KG_URL: ${GW_KG_URL:?kg 사설 주소 필요 (.env 또는 셸/compose에 지정)}
      GW_JWT_PUBLIC_KEY: ${GW_JWT_PUBLIC_KEY:-}
      GW_CORS_ORIGINS: ${GW_CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 15s
