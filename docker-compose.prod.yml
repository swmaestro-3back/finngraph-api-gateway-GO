name: finngraph-gateway

services:
  gateway:
    build: .
    image: ${GW_IMAGE:-finngraph-gateway:latest}
    container_name: finngraph-gateway
    ports:
      - "${GW_BIND:-0.0.0.0:8090}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD", "/gateway", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    stop_grace_period: 15s
